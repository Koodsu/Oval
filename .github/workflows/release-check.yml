name: Release Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bridge_test
      EXPO_PUBLIC_API_URL: https://bridge-phi-plum.vercel.app
      EXPO_PUBLIC_APP_SITE_URL: https://www.theovalapp.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            landing/package-lock.json

      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm ci --prefix landing
      - run: npm run release:check
