="702" x2="472" y2="629" stroke="#B0483F" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="448" cy="702" r="3" fill="#B0483F" /><text x="478" y="633" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="700" >Skip is available but quiet. Instrument the</text><text x="478" y="648" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="400" >full funnel: onboarding.started →</text><text x="478" y="663" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="400" >first_pod_joined.</text>
