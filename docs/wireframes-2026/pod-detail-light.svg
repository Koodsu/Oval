e the fold.</text><line x1="448" y1="562" x2="472" y2="569" stroke="#B0483F" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="448" cy="562" r="3" fill="#B0483F" /><text x="478" y="573" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="700" >Chat preview with unread pill — pod chat</text><text x="478" y="588" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="400" >currently has NO read state anywhere in the</text><text x="478" y="603" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="400" >app.</text>
