  <line x1="448" y1="212" x2="472" y2="89" stroke="#B0483F" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="448" cy="212" r="3" fill="#B0483F" /><text x="478" y="93" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="700" >One hero = one next action. Merges "Your day"</text><text x="478" y="108" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="400" >+ "Your next move" — the old Home stacked 7</text><text x="478" y="123" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="400" >sections with duplicate content.</text><line x1="448" y1="322" x2="472" y2="189" stroke="#B0483F" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="448" cy="322" r="3" fill="#B0483F" /><text x="478" y="193" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="700" >Pulse adds "friends out" — social proof, not</text><text x="478" y="208" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="400" >just inventory counts.</text><line x1="448" y1="392" x2="472" y2="309" stroke="#B0483F" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="448" cy="392" r="3" fill="#B0483F" /><text x="478" y="313" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="700" >Inline Join on feed rows. Today the core</text><text x="478" y="328" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="400" >action is 2 taps away behind PodDetail.</text><line x1="448" y1="417" x2="472" y2="409" stroke="#B0483F" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="448" cy="417" r="3" fill="#B0483F" /><text x="478" y="413" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="700" >Friends-going avatars on cards — the #1 reason</text><text x="478" y="428" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="400" >a student actually shows up.</text><line x1="448" y1="542" x2="472" y2="529" stroke="#B0483F" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="448" cy="542" r="3" fill="#B0483F" /><text x="478" y="533" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="700" >Map demoted to a compact strip; it was a 200px</text><text x="478" y="548" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="400" >dead zone (non-scrollable) mid-feed.</text><line x1="448" y1="852" x2="472" y2="649" stroke="#B0483F" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="448" cy="852" r="3" fill="#B0483F" /><text x="478" y="653" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="700" >Dock badge fed by ONE /inbox/summary call</text><text x="478" y="668" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#3E3944" font-weight="400" >incl. pod-chat unreads (new read-state).</text>
